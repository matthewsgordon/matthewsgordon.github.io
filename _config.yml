# Site settings
title: Matthew Gordon
email: your-email@example.com
description: >-
  Personal website of Matthew Gordon — blog posts, projects, publications,
  and a bit about me.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://matthewsgordon.github.io" # the base hostname & protocol
twitter_username: matthewsgordon
github_username: matthewsgordon

# Collections
collections:
  projects:
    output: true

# Build settings
markdown: kramdown
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Exclude from processing
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - README.md